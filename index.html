<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Crypto AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <div class="logo">Crypto AI</div>
  <nav>
    <ul>
      <li class="nav-item active" data-section="home">Accueil</li>
      <li class="nav-item" data-section="crypto">Crypto</li>
      <li class="nav-item" data-section="settings">Paramètres</li>
    </ul>
  </nav>
</div>

<div class="main">

<section id="home" class="section active">
  <h1>Crypto AI</h1>
  <p>IA + Manuel combinés 🔥</p>
</section>

<section id="crypto" class="section">

<h2>Marché Crypto</h2>

<div class="ia-box">
  <span id="iaState">IA activée</span>
  <button class="btn" onclick="toggleIA()">IA ON / OFF</button>
</div>

<div id="cards" class="cards"></div>

<h3 id="selectedTitle">Crypto sélectionnée</h3>

<canvas id="chart" style="margin:40px 0;"></canvas>

<div class="data">
  <div id="price">--</div>
  <p>RSI : <strong id="rsi">--</strong></p>
  <p>Tendance : <strong id="trend">--</strong></p>
  <p>Décision : <strong id="decision">--</strong></p>
  <p>Position : <strong id="position">--</strong></p>
  <p>Capital : <strong id="capital">--</strong></p>
</div>

<select id="cryptoSelect" class="btn">
  <option value="BTC/USDC">Bitcoin</option>
  <option value="ETH/USDC">Ethereum</option>
  <option value="SOL/USDC">Solana</option>
</select>

<div style="margin-top:20px;">
  <input type="number" id="manualAmount" placeholder="Montant en USDC" class="btn">
  <button class="btn" onclick="manualBuy()">BUY</button>
  <button class="btn" onclick="manualSell()">SELL</button>
</div>

<h3>Historique</h3>
<table>
  <thead>
    <tr>
      <th>Heure</th>
      <th>Symbole</th>
      <th>Action</th>
      <th>Prix</th>
      <th>PNL</th>
    </tr>
  </thead>
  <tbody id="history"></tbody>
</table>

</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
